[workspace]
resolver = "2"
members = [
    "crates/freemkv-chipset",
    "crates/freemkv-flash",
    "crates/freemkv-flash-gui",
    "crates/freemkv-fw",
    "crates/freemkv-fw-gui",
]

[workspace.package]
# freemkv-firmware versions INDEPENDENTLY of the rest of the freemkv stack.
version = "0.16.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Matthew Jackson <1085847+MattJackson@users.noreply.github.com>"]
repository = "https://github.com/freemkv/freemkv-firmware"

[workspace.lints.clippy]
all = "warn"

# Shipped-binary build flags. Applied to every release artifact (CLI + GUI,
# all platforms) so they are consistently small and symbol-free, not just the
# .deb (which also strips at package time). `strip` removes symbols; thin LTO +
# one codegen unit trade build time for a smaller, faster binary.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Catalog tests authenticate thousands of full firmware images. Optimize only
# the image/crypto dependencies; workspace tests keep debug assertions and
# overflow checks, and GUI dependencies avoid an expensive optimized build.
[profile.test.package.mediatek-optical]
opt-level = 2

[profile.test.package.pioneer-optical]
opt-level = 2

[profile.test.package.cmac]
opt-level = 2

[profile.test.package.aes]
opt-level = 2

[profile.test.package.sha2]
opt-level = 2

[profile.test.package.digest]
opt-level = 2
