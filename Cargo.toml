[workspace]
resolver = "2"
members = [
    "crates/freemkv-chipset",
    "crates/freemkv-flash",
    "crates/freemkv-flash-gui",
    "crates/freemkv-fw",
    "crates/freemkv-fw-gui",
]

[workspace.package]
# freemkv-firmware versions INDEPENDENTLY of the rest of the freemkv stack.
version = "0.11.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Matthew Jackson <1085847+MattJackson@users.noreply.github.com>"]
repository = "https://github.com/freemkv/freemkv-firmware"

[workspace.lints.clippy]
all = "warn"

# Shipped-binary build flags. Applied to every release artifact (CLI + GUI,
# all platforms) so they are consistently small and symbol-free, not just the
# .deb (which also strips at package time). `strip` removes symbols; thin LTO +
# one codegen unit trade build time for a smaller, faster binary.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# pioneer-optical 0.12.4 (production record) from git until it is published.
[patch.crates-io]
pioneer-optical = { git = "https://github.com/MattJackson/pioneer-optical", rev = "d9aa3b3c8b11ab3a72d9cee7c6576c5ce205c22e" }
