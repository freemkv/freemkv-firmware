[package]
name = "freemkv-flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "freemkv standalone optical-drive firmware flasher/dumper (MediaTek MT19xx; Pioneer/Renesas classified but unsupported)"

[[bin]]
name = "freemkv-flash"
path = "src/main.rs"

[lib]
name = "freemkv_flash"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crc32fast = "1"
tar = "0.4"
aes = "0.8"
cmac = "0.7"
cipher = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
