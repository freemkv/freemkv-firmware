[package]
name = "freemkv-flash"
publish = false  # internal firmware crate; git-tag/path-deps siblings, never on crates.io
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "freemkv device firmware info, backup, and flash (MediaTek MT19xx; Pioneer live writes gated)"

[[bin]]
name = "freemkv-flash"
path = "src/main.rs"

[lib]
name = "freemkv_flash"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
toml = "0.8"
crc32fast = "1"
tar = "0.4"
aes = "0.8"
cmac = "0.7"
cipher = "0.4"
sha2 = "0.10"
getrandom = "0.3"
pioneer-optical = { version = "=0.12.4", features = ["drive", "envelope", "analysis", "firmware-info"] }
# Shared step-1 chipset detection (MTEKMT19xx family key) — the same detector
# freemkv-fw uses, so the flash tool and the modify tool never disagree on a
# firmware image's family. Detection-only crate (std + anyhow); no cycle.
freemkv-chipset = { path = "../freemkv-chipset" }
mediatek-optical = { git = "https://github.com/MattJackson/mediatek-optical", branch = "dev", features = ["drive", "image", "enc", "oem"] }
# The SCSI pass-through transport (SG_IO / IOKit / SPTI + the macOS shim) is the
# `scsi` feature of libfreemkv — the single source of truth for that layer.
# freemkv-flash used to carry a trimmed copy of those backends; now it adapts
# libfreemkv's `ScsiTransport` behind its own `ScsiDevice`. `default-features =
# false` takes ONLY the transport (libc + tracing), none of the ripping tree, so
# there is no dependency cycle back onto the firmware/unlock side.
libfreemkv = { git = "https://github.com/freemkv/libfreemkv", tag = "v1.8.2", default-features = false, features = ["scsi"] }

[lints]
workspace = true
