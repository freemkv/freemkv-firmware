[package]
name = "freemkv-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "freemkv optical-drive firmware flasher and firmware-build pipeline (MediaTek MT19xx / Pioncer-Renesas)"

[[bin]]
name = "freemkv-firmware"
path = "src/main.rs"

[lib]
name = "freemkv_firmware"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crc32fast = "1"
aes = "0.8"
cmac = "0.7"
cipher = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
