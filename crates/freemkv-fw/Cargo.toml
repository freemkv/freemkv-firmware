[package]
name = "freemkv-fw"
publish = false  # internal firmware crate; git-tag/path-deps siblings, never on crates.io
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "freemkv firmware authoring tool: verify and re-sign MediaTek MT19xx integrity (AES-CMAC) tables, and probe live drives for freemkv firmware"

[lib]
name = "freemkv_fw"
path = "src/lib.rs"

[[bin]]
name = "freemkv-fw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The integrity engine (table parse + AES-CMAC + re-sign) lives in freemkv-flash;
# freemkv-fw is a thin authoring CLI over it — no duplicated crypto.
freemkv-flash = { path = "../freemkv-flash" }
# Shared step-1 chipset detection + capability taxonomy (also used by
# freemkv-flash), so both tools identify a family the same way.
freemkv-chipset = { path = "../freemkv-chipset" }
# Generic ARM-Thumb (T1/T2) instruction builder, encoder/decoder, and patch-site
# finder — the single source of truth for every Thumb primitive this crate
# builds detours out of. Published crate; we are a pure consumer. The two
# anyhow-flavored emit-time install guards (`assert_bl_install` /
# `assert_b_wide_install`) that adapt `thumb_asm`'s decoders to this crate's
# `anyhow::Result` error type live in `src/install_guard.rs`; every actual
# encode/decode/find primitive lives in the upstream crate.
thumb-asm = "=0.13.0"

[dev-dependencies]
# Throwaway corpus-scoreboard / golden-KAT harness only (tests/corpus_scoreboard.rs):
# hash de-wrapped inputs and produced images for the reproducibility lock.
sha2 = "0.10"

[lints]
workspace = true
