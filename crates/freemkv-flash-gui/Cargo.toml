[package]
name = "freemkv-flash-gui"
publish = false  # internal firmware crate; git-tag/path-deps siblings, never on crates.io
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Desktop UI for freemkv-flash: a neutral model with native (AppKit, Win32, GTK4) and egui shells"
build = "build.rs"

[[bin]]
name = "freemkv-flash-gui"
path = "src/main.rs"

[features]
default = ["native"]
# The native shell for each OS: AppKit on macOS, Win32 (winsafe) on Windows, GTK4 +
# libadwaita on glibc Linux. Linux musl and every other target use the egui shell.
# Toolkit crates are pinned like freemkv's `gui` feature.
native = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:block2",
          "dep:winsafe", "dep:gtk4", "dep:libadwaita"]

[dependencies]
freemkv-flash = { path = "../freemkv-flash" }
anyhow = "1"

# eframe/egui: pure-Rust, immediate-mode GUI. Trivially cross-platform
# (macOS + Windows + Linux) with no system webview. egui is re-exported as
# `eframe::egui`. The window icon is decoded from a PNG at startup.
eframe = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
# Native "open file" / "save file" dialogs on every platform.
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { optional = true, version = "0.3", features = [
  "NSApplication", "NSWindow", "NSView", "NSControl", "NSButton", "NSButtonCell",
  "NSTextField", "NSTextFieldCell", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSResponder",
  "NSProgressIndicator", "NSBox", "NSOutlineView", "NSTableView", "NSTableColumn",
  "NSScrollView", "NSClipView", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSGraphics",
  "NSCell", "NSActionCell", "NSStackView", "NSGridView", "NSLayoutConstraint",
  "NSLayoutAnchor", "NSUserInterfaceLayout", "NSFont", "NSColor", "NSImage",
  "NSRunningApplication", "NSTextView", "NSText", "NSAlert", "NSSegmentedControl",
  "NSSegmentedCell", "NSPasteboard", "NSAppearance", "NSParagraphStyle", "NSTextContainer",
  "NSTextStorage", "NSLayoutManager", "NSAttributedString", "NSSplitView", "block2",
  # The debug-only GUI gate: window captures and its run-loop pump.
  "NSBitmapImageRep", "NSImageRep", "NSEvent",
] }
objc2-foundation = { optional = true, version = "0.3", features = [
  "NSString", "NSGeometry", "NSArray", "NSObjCRuntime", "NSNotification", "NSDate",
  "NSTimer", "NSRunLoop", "NSURL", "NSValue", "NSDictionary", "NSEnumerator", "NSError",
  "NSRange", "NSAttributedString", "NSBundle", "NSThread", "NSProcessInfo",
] }
# The confirmation sheet's completion handler. PINNED with `=`, as freemkv does.
block2 = { version = "=0.6", optional = true }

# ── Windows native shell ──────────────────────────────────────────────────
# `winsafe`: safe Win32 with no dependencies; every control is the OS's own. PINNED with
# `=`: pre-1.0 and it breaks its API between releases, so upgrade deliberately.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { optional = true, version = "=0.0.29", features = ["gui", "shell"] }

# ── Linux native shell (GTK4 + libadwaita) ────────────────────────────────
# PINNED with `=`, as in freemkv. GATED on `target_env = "gnu"`: GTK4 needs the glibc
# runtime and cannot link against musl, so the musl builds keep the egui shell. The
# features match freemkv's floor (GTK 4.10, libadwaita 1.4: Ubuntu 24.04 and later).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
gtk4 = { optional = true, version = "=0.9", features = ["v4_10"] }
libadwaita = { optional = true, version = "=0.7", features = ["v1_4"] }

# On a Windows host build, embed the freemkv .ico and the application manifest.
# No-op when building on macOS/Linux (guarded by cfg(windows) in build.rs).
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
