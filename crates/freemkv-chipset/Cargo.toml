[package]
name = "freemkv-chipset"
publish = false  # internal shared kernel; path-dep of freemkv-fw and freemkv-flash
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared optical-drive chipset identity (re-exported from mediatek-optical) + media-capability taxonomy, used by both the modify and flash tools"

[lib]
name = "freemkv_chipset"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
mediatek-optical = { git = "https://github.com/MattJackson/mediatek-optical", rev = "727309cea76e86955090ae6ff0c41a69a05219a1", features = ["image"] }

[lints]
workspace = true
