[package]
name = "freemkv-chipset"
publish = false  # internal shared kernel; path-dep of freemkv-fw and freemkv-flash
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared optical-drive chipset identity (re-exported from mediatek-optical) + media-capability taxonomy, used by both the modify and flash tools"

[lib]
name = "freemkv_chipset"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
mediatek-optical = { version = "=1.2.0", git = "https://github.com/MattJackson/mediatek-optical", rev = "a3a667984081de1b12a3fdd4d7a2372ee5f9a4a7", features = ["image"] }

[lints]
workspace = true
