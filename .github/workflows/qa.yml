name: qa

# ── The qa gate: "is this production worth?" ────────────────────────────────
#
# dev -> qa -> main.
#
# `dev` is for committing often. ci.yml answers "is it green" in minutes with
# fmt, clippy and the unit suite. `qa` is the release-candidate branch, and THIS
# workflow is the claim that a commit is production worth: everything expensive
# that can run without physical media. `main` only ever receives a qa that went
# green here.
#
# What this gate CANNOT cover: real flashing needs a sacrificial MT19xx drive,
# and no hosted runner has one. That leg stays on hardware, by hand.
#
# Build jobs check themselves out into `freemkv-firmware/` and run there. All
# dependencies resolve from the committed Cargo.lock.
on:
  push:
    branches: [qa]
  workflow_dispatch:

# A re-push to qa supersedes its own in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every candidate builds and smoke-tests every shipped architecture/package.
  # A source-only change must not bypass release packaging validation.
  release-packages:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  # Single source of truth for the MSRV — see ci.yml. Jobs that build/test AT
  # the MSRV read `needs.resolve-msrv.outputs.v` from Cargo.toml's rust-version;
  # clippy (cross-lint) runs on stable instead.
  resolve-msrv:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.msrv.outputs.v }}
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        shell: bash
        run: echo "v=$(grep -m1 -E '^[[:space:]]*rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

  # ── Name the candidate ────────────────────────────────────────────────
  # Every push to `qa` is a release candidate, so every push gets a tag:
  # v<version>-rc<N>, N incrementing. Runs FIRST and does not depend on the
  # gates — a red candidate needs a name more than a green one does. Only reads
  # Cargo.toml + tags.
  rc-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stamp the next rc
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$v" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          # Numeric sort on the rc ordinal: -rc10 must beat -rc9.
          n=$(git tag -l "v$v-rc*" | sed "s|^v$v-rc||" | sort -n | tail -1)
          tag="v$v-rc$(( ${n:-0} + 1 ))"
          git tag "$tag"
          git push origin "$tag"
          echo "### Candidate \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  # Release is a DIFFERENT build: overflow checks off, debug_assert! compiled
  # out, inlining changes what the optimiser proves. A test that only passes in
  # debug never guarded the binary anyone ships.
  release-tests:
    needs: resolve-msrv
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
      # The flash GUI's native Linux shell (gtk4/libadwaita) probes pkg-config at build time.
      - name: Install GTK4 + libadwaita development headers
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev
      - run: cargo test --release --tests

  # clippy's output is target-dependent: cfg-gated code only gets linted on the
  # target it compiles for. Linting solely on the dev host is how a lint that CI
  # rejects reaches a push. clippy runs on stable (matches ci.yml's lint job);
  # build/test stay on the MSRV pin.
  cross-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
      - name: Install GTK4 + libadwaita development headers
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Windows compiles the tests but does not run them. The value is codegen: the
  # #[cfg(windows)] half of the SCSI transport compiles on no other runner, so
  # without this it is first built at release time.
  windows-build:
    needs: resolve-msrv
    runs-on: windows-latest
    defaults:
      run:
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
      - run: cargo build --release --all-targets --all-features

  # freemkv-fw claims it can modify (create + re-verify) 100% of the FORGEABLE
  # firmware images we hold — "forgeable" meaning a plaintext MediaTek MT1959
  # image with a valid AES-CMAC table, per crates/freemkv-fw/tests/
  # corpus_create_verify.rs's own independent classifier (NOT freemkv-fw's own
  # detection — see that file's header for why that independence matters).
  #
  # This gates on the committed OEM fixture under crates/freemkv-fw/tests/fixtures/
  # (stock manufacturer dumps ONLY — no MakeMKV-modified images are committed to
  # this PUBLIC repo). The full corpus, including MK-signed images, lives in a
  # private store and is never pulled into a public run (it would leak
  # firmware via logs/artifacts).
  #
  # The FULL corpus is still run the same way, just manually / locally, by
  # pointing FREEMKV_FW_CORPUS at the private checkout:
  #   FREEMKV_FW_CORPUS=/path/to/hoard/organized,/path/to/hoard/incoming \
  #     cargo +1.94 test -p freemkv-fw --test corpus_create_verify -- --nocapture
  forge-corpus:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
      - name: Prove freemkv-fw modifies 100% of the fixture corpus
        run: |
          set -euo pipefail
          export FREEMKV_FW_CORPUS="$PWD/crates/freemkv-fw/tests/fixtures"
          cargo test -p freemkv-fw --test corpus_create_verify -- --nocapture

  # The desktop app checks itself on every OS it ships a native shell for: a debug build
  # (the only one with the FREEMKV_FLASH_GATE hook) starts on a synthetic drive, never real
  # hardware, walks every tab, opens and cancels the flash confirmation twice and reads its
  # Confirm button from the native widget, checks its captures for ink, and writes gate.txt
  # and a PNG per tab (tests/gui_gate.py). Linux runs under Xvfb and a private D-Bus session.
  gui-gate:
    needs: resolve-msrv
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            bin: freemkv-flash-gui
          - os: windows
            runner: windows-latest
            bin: freemkv-flash-gui.exe
          - os: macos
            runner: macos-latest
            bin: freemkv-flash-gui
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv-firmware
          persist-credentials: false
      - name: Toolchain (the MSRV)
        env:
          TC: ${{ needs.resolve-msrv.outputs.v }}
        run: |
          rustup toolchain install "$TC" --profile minimal --no-self-update
          rustup default "$TC"
      - name: Install GTK4, libadwaita and a virtual display (Linux)
        if: matrix.os == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev xvfb xauth dbus
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv-firmware
          key: gui-gate
      - name: Build the debug GUI with its gate hook
        run: cargo build --locked -p freemkv-flash-gui --features native
      - name: GUI gate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          out="$RUNNER_TEMP/gui-gate"
          app="target/debug/${{ matrix.bin }}"
          if [ "${{ matrix.os }}" = linux ]; then
            dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' \
              "$py" tests/gui_gate.py "$app" "$out"
          else
            "$py" tests/gui_gate.py "$app" "$out"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gui-gate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gui-gate/*.png
            ${{ runner.temp }}/gui-gate/gate.txt
            ${{ runner.temp }}/gui-gate/panic.txt
          if-no-files-found: warn
