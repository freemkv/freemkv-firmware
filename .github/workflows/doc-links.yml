name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# Dependencies resolve from the committed Cargo.lock; the toolchain from
# rust-version.
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v1
    with:
      self: freemkv-firmware
