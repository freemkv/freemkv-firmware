name: CI

on:
  # dev -> qa -> main. `dev` is where work lands and is pushed often: these are
  # the FAST checks, so a mistake surfaces in minutes. `qa` is the release
  # candidate — it runs these too, plus the expensive suite in qa.yml. `main`
  # only moves at release time, to a commit already green on qa.
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      coverage_only:
        description: Run optional instrumented library coverage separately from release gates
        type: boolean
        default: false

# Rapid dev pushes supersede their own in-progress runs instead of stacking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every build job checks itself out into `freemkv-firmware/` and runs there.
# All dependencies resolve from the committed Cargo.lock.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Single source of truth for the MSRV: `rust-version` in Cargo.toml. Every job
  # that builds AT the MSRV consumes needs.resolve-msrv.outputs.v so the floor
  # cannot drift. clippy deliberately runs on `stable`.
  resolve-msrv:
    # Promotion PRs already have the exact head validated by its branch push.
    # Feature branches and forks still run their full PR checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(fromJSON('["dev","qa","main"]'), github.head_ref)
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.msrv.outputs.v }}
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before', '')
          changed = True
          if base and set(base) != {'0'}:
              result = subprocess.run(['git', 'diff', '--name-only', base, 'HEAD'], capture_output=True, text=True)
              if result.returncode == 0:
                  changed = any(not path.startswith('.github/') for path in result.stdout.splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('code_changed=' + str(changed).lower() + '\n')
          PYCODE
      - id: msrv
        shell: bash
        run: echo "v=$(grep -m1 -E '^[[:space:]]*rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

  # CI owns the changelog: main may never carry a version without a CHANGELOG.md
  # entry for it. Hard-fails on main (and PRs targeting main); warns elsewhere so
  # an in-progress dev/qa branch whose entry isn't written yet is not blocked.
  # Only reads Cargo.toml/CHANGELOG.md.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a CHANGELOG entry for the crate version on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${version}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## [${version}]' entry"
          if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::${msg} — main requires a changelog entry for the released version."
            exit 1
          fi
          echo "::warning::${msg} (allowed on ${GITHUB_REF_NAME:-unknown}; required before it can reach main)."

  # BUG B2: a stale Cargo.lock used to slip through every gate and only fail at
  # the release `cargo build --locked` — days after the drift landed (it broke
  # v0.8.1/v0.8.2). This surfaces the same drift on every dev/qa push in ~1 min:
  # `cargo metadata --locked` refuses to rewrite the lock, so a lock that no
  # longer matches the manifests fails here instead of at the release tag.
  locked:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - name: Cargo.lock is up to date (--locked)
        working-directory: freemkv-firmware
        run: cargo metadata --locked --format-version=1 >/dev/null

  # fmt on the pinned MSRV; clippy on stable so new-lint debt is a blocking gate
  # the pinned version would hide. --all-targets lints the test code too.
  lint:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - if: needs.resolve-msrv.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: needs.resolve-msrv.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
          components: rustfmt
      - if: needs.resolve-msrv.outputs.code_changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
          cache-on-failure: true
      # The flash GUI's native Linux shell (gtk4/libadwaita) probes pkg-config at build time.
      - if: needs.resolve-msrv.outputs.code_changed == 'true'
        name: Install GTK4 + libadwaita development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev
      - if: needs.resolve-msrv.outputs.code_changed == 'true'
        run: cargo fmt --all --check
        working-directory: freemkv-firmware
      - name: Validate workflow and promotion logic
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck=''
          python3 .github/scripts/test_promote_qa.py
        working-directory: freemkv-firmware
      - if: needs.resolve-msrv.outputs.code_changed == 'true' && !inputs.coverage_only
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
        working-directory: freemkv-firmware

  test:
    if: needs.resolve-msrv.outputs.code_changed == 'true' && !inputs.coverage_only
    needs: resolve-msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
          cache-on-failure: true
      # The flash GUI's native Linux shell (gtk4/libadwaita) probes pkg-config at build time.
      - name: Install GTK4 + libadwaita development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev
      # Includes the CMAC-verify T0 proof against a committed stock image.
      - run: cargo test --tests
        working-directory: freemkv-firmware
      - name: Execute MediaTek hook contracts on an independent ARM CPU
        working-directory: freemkv-firmware
        run: |
          python3 -m venv "$RUNNER_TEMP/hook-cpu"
          "$RUNNER_TEMP/hook-cpu/bin/python" -m pip install --only-binary=:all: unicorn==2.1.4
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-hook-execution.py --fw target/debug/freemkv-fw
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-runtime-execution.py --fw target/debug/freemkv-fw
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-integrity-routing.py
          FREEMKV_BASE_ROLE_CORPUS="$PWD/crates/freemkv-fw/tests/fixtures/native-response-inputs.json" \
            FREEMKV_BASE_ROLE_HOARD="$PWD/crates/freemkv-fw/tests/fixtures" \
            FREEMKV_BASE_ROLE_OUTPUT="$RUNNER_TEMP/native-response-contracts.json" \
            cargo test -p freemkv-fw --lib native_response_contract_corpus
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-native-response-execution.py \
            --contracts "$RUNNER_TEMP/native-response-contracts.json" \
            --inventory crates/freemkv-fw/tests/fixtures/native-response-inputs.json \
            --hoard crates/freemkv-fw/tests/fixtures \
            --output "$RUNNER_TEMP/native-response-cpu.json"
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-program-routing.py
          cargo build -p freemkv-fw --example mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-hrl-execution.py --fw target/debug/freemkv-fw --builder target/debug/examples/mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-region-execution.py --fw target/debug/freemkv-fw --builder target/debug/examples/mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-frame-execution.py --candidate-builder target/debug/examples/mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-classic-dispatch.py --candidate-builder target/debug/examples/mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-classic-speed.py --builder target/debug/examples/mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/audit-mtk-speed-policy.py --builder target/debug/examples/mtk_receiver_evidence
          "$RUNNER_TEMP/hook-cpu/bin/python" scripts/test-mtk-uhd-conversion.py --builder target/debug/examples/mtk_receiver_evidence

  # cargo-deny — audits the RESOLVED graph (RUSTSEC advisories, licence
  # allow-list, source/ban hygiene) against the committed Cargo.lock + deny.toml.
  # Runs on stable: it resolves and audits the graph, it does not build code.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          manifest-path: freemkv-firmware/Cargo.toml

  # ── Coverage (non-required, additive) ───────────────────────────────────────
  #
  # Reports line coverage to Codecov. Deliberately NOT wired into any release
  # gate: it is informational only and no other job `needs:` it. Mirrors the
  # `test` job's layout and MSRV toolchain. cargo-llvm-cov comes as a prebuilt binary from
  # taiki-e/install-action, so it is toolchain-independent.
  coverage:
    # Keep coverage on release candidates; avoid a second instrumented test
    # suite on every dev push and on promotion PRs.
    if: github.event_name == 'workflow_dispatch' && inputs.coverage_only
    needs: resolve-msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Cover the library crates only. The egui/wgpu GUI bins carry no meaningful
      # unit coverage and building them under instrumentation is slow and brittle.
      - run: cargo llvm-cov --workspace --exclude freemkv-flash-gui --exclude freemkv-fw-gui --ignore-run-fail --lcov --output-path lcov.info
        working-directory: freemkv-firmware
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: freemkv-firmware/lcov.info
          slug: freemkv/freemkv-firmware
          fail_ci_if_error: false
