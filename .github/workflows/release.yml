name: release

# Build the freemkv-flash / freemkv-fw CLIs and their desktop GUIs for every
# shipping platform and attach them to a GitHub Release when a version tag is
# pushed. Each tool ships freemkv's distribution set (minus the store
# packages, Flatpak and Snap), and every GUI download also carries its CLI.
#
# ── What a release ships, per tool (<t> = freemkv-flash | freemkv-fw) ───────
# Every asset has a STABLE, unversioned name (so the site can link
# https://github.com/freemkv/freemkv-firmware/releases/latest/download/<asset>)
# and a sibling `<asset>.sha256`.
#   Windows  <t>-<arch>-windows-setup.exe    per-user installer: GUI + CLI, CLI
#                                            on PATH, Start-menu shortcut
#            <t>-<arch>-windows.zip          portable: GUI + CLI
#            <t>-cli-<arch>-windows.exe      bare CLI          (arch: x86_64, aarch64)
#            freemkv-firmware-<arch>-windows-setup.exe / .zip  both tools
#   macOS    <t>-gui-macos-<arch>.zip        <t>-gui.app, with the CLI at
#                                            Contents/MacOS/<t> (Homebrew cask)
#            <t>-macos-<arch>.tar.gz         CLI (Homebrew formula)
#            <t>-cli-<arch>-macos            bare CLI          (arch: aarch64, x86_64)
#   Linux    <t>-gui-<amd64|arm64>.deb       GUI + CLI (Conflicts/Replaces <t>)
#            <t>-<amd64|arm64>.deb           static CLI only, no dependencies
#            <t>-<x86_64|aarch64>-linux.AppImage  GUI + CLI (any argument runs the CLI)
#            <t>-cli-<x86_64|aarch64>-linux  bare static (musl) CLI
#            <t>-linux-<x86_64|aarch64>.tar.gz    static CLI (Homebrew formula on Linux)
# Kept for existing links/the tap: the per-binary <bin>-<os>-<arch>.{tar.gz,zip}
# archives (<bin> also <t>-gui, which holds the CLI too) and their versioned
# <bin>-<tag>-<os>-<arch> copies. The tap's update.sh reads the macOS
# tar.gz/zip and linux-x86_64 tar.gz names above -- do not rename them.
#
# ── How each is built ──────────────────────────────────────────────────────
# `build`: CLIs on all six targets (the macOS IOKit / Windows SPTI / Linux SG_IO
# backends come from libfreemkv); GUIs (eframe/egui) on macOS and Windows
# (Windows arm64 on the native windows-11-arm runner).
# Linux CLIs are static musl (aarch64 cross-compiled with `cross`).
# `linux-packages`: glibc GUIs on native amd64/arm64 runners, .deb + AppImage
# (packaging/linux/). `windows-installer`: Inno Setup (packaging/windows/).
#
# Branch pushes / PRs touching the packaging run everything as a dry run
# (see `on:`); only tag runs publish or update the Homebrew tap.
#
# Build jobs check themselves out into `freemkv-firmware/` and run under
# `working-directory: freemkv-firmware`, as ci.yml does. All dependencies
# resolve from the committed Cargo.lock.

on:
  push:
    tags:
      # Release only on real version tags. Release candidates (v<ver>-rc<N>,
      # stamped on every push to `qa`) match `v*` too, so they are excluded —
      # otherwise every candidate, including the red ones, would publish a
      # GitHub Release.
      - 'v*'
      - '!v*-rc*'
    # Dry runs: build, package and smoke-test every asset WITHOUT publishing
    # (every publish step and the tap update are tag-only), like freemkv's
    # deb.yml/appimage.yml. Branch pushes are path-filtered so CI proves the
    # packaging whenever it (or the version/lock) changes, without running the
    # full three-OS release build on every dev commit. GitHub does not apply
    # `paths` to tag pushes, so releases are unaffected.
    branches: [dev, qa]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'macos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'macos/**'
  workflow_dispatch:

# A newer dry run supersedes an older one on the same ref; a tag run is never
# cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guard: a tag must agree with the crate version it claims to release. Only
  # meaningful for tag pushes (a workflow_dispatch from a branch has no version
  # tag), so it is skipped otherwise. Does not block `build` — see below.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          cargo_ver="v$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$cargo_ver" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Cargo.toml says $cargo_ver but tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Version match: $cargo_ver"

  # Single source of truth for the MSRV: `rust-version` in Cargo.toml, so the
  # shipped binary is built with the same compiler CI gates on and the pin
  # cannot drift from the manifest.
  resolve-msrv:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.msrv.outputs.v }}
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        shell: bash
        run: echo "v=$(grep -m1 -E '^[[:space:]]*rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

  build:
    # verify is a fast tripwire that fails the run on a version mismatch, but
    # packaging can start in parallel — so `build` only waits on resolve-msrv
    # (a few seconds) to learn the toolchain, not on `verify`.
    needs: resolve-msrv
    strategy:
      # One red leg (e.g. a backend that stops compiling on its host) must not
      # cancel the others — the platforms that do build should still ship.
      fail-fast: false
      matrix:
        include:
          # Linux: static musl so the CLI is portable across distros (no glibc
          # version coupling). GUIs are skipped here (no windowing/GPU on musl).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            osname: linux
            arch: x86_64
            archive: tar.gz
            binext: ''
            gui: false
          # Linux arm64: the same static musl CLIs, cross-compiled (below).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            osname: linux
            arch: aarch64
            archive: tar.gz
            binext: ''
            gui: false
          # macOS: ship both architectures as separate binaries, GUIs included.
          - os: macos-latest
            target: x86_64-apple-darwin
            osname: macos
            arch: x86_64
            archive: tar.gz
            binext: ''
            gui: true
          - os: macos-latest
            target: aarch64-apple-darwin
            osname: macos
            arch: aarch64
            archive: tar.gz
            binext: ''
            gui: true
          # Windows: MSVC toolchain, GUIs included.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            osname: windows
            arch: x86_64
            archive: zip
            binext: '.exe'
            gui: true
          # Windows on Arm: native arm64 runner, GUIs included.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            osname: windows
            arch: aarch64
            archive: zip
            binext: '.exe'
            gui: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware

      # Pin to the toolchain the project targets (rust-version), so the shipped
      # binary is built with the same compiler CI gates on.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
          shared-key: freemkv-firmware-release
          key: ${{ matrix.target }}

      # musl needs its C toolchain for the linker; the CLI's deps are otherwise
      # pure Rust, so no cross-container is required for x86_64.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        working-directory: .

      # arm64 musl goes through `cross`, as freemkv's cli-binaries job does: a
      # plain x86 `cargo build --target` has no aarch64 linker. Pinned +
      # hash-checked, and the build image pinned by digest.
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSLo cross.tar.gz https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz
          echo 'a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  cross.tar.gz' | sha256sum -c -
          tar xzf cross.tar.gz cross
          sudo mv cross /usr/local/bin/
          echo 'CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE=ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4' >> "$GITHUB_ENV"

      - name: Build the CLIs (release)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin freemkv-flash --bin freemkv-fw

      - name: Build the CLIs (release, cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --locked --target ${{ matrix.target }} --bin freemkv-flash --bin freemkv-fw

      # The Linux CLIs must be static (no NEEDED entries), on both arches.
      - name: Verify the Linux CLIs are static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for b in freemkv-flash freemkv-fw; do
            bin="target/${{ matrix.target }}/release/$b"
            if readelf -d "$bin" | grep -q NEEDED; then
              readelf -d "$bin"; echo "::error::$bin is not static"; exit 1
            fi
          done

      - name: Build the GUIs (release)
        if: matrix.gui
        run: cargo build --release --locked --target ${{ matrix.target }} -p freemkv-flash-gui -p freemkv-fw-gui

      # macOS desktop apps: wrap each GUI binary (and its CLI, at
      # <bin>.app/Contents/MacOS/<cli>, for the cask's `binary` stanza) in a
      # <bin>.app and ship it in a
      # plain .zip — the artifact a Homebrew cask installs into /Applications.
      # NO .dmg: a manually-downloaded dmg would trip Gatekeeper (ad-hoc signed,
      # not notarized), but a cask curl-fetches the zip and strips
      # com.apple.quarantine on install, so there is no security prompt. bundle.sh
      # re-runs the GUI build, reusing the artifacts the step above compiled. The
      # zip names mirror the tarballs' <bin>-macos-<arch> convention: the two
      # macOS legs produce e.g. freemkv-flash-gui-macos-aarch64.zip.
      - name: Bundle the macOS apps (.app in a .zip)
        if: matrix.gui && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          arch='${{ matrix.arch }}'
          for bin in freemkv-flash-gui freemkv-fw-gui; do
            bash macos/bundle.sh "$bin" release "$target"
            zip="$bin-macos-$arch.zip"
            ditto -c -k --keepParent "target/$bin.app" "$zip"
            shasum -a 256 "$zip" > "$zip.sha256"
          done

      # Package each binary that got built into its own archive: a stable
      # unversioned name (the "latest" download URL the site links) plus a
      # version-stamped copy, each with a SHA-256 sidecar.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          osname='${{ matrix.osname }}'
          arch='${{ matrix.arch }}'
          fmt='${{ matrix.archive }}'
          ext='${{ matrix.binext }}'
          # workflow_dispatch from a branch has no version tag; label those runs
          # so a manual test build still produces sensibly-named archives.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then ver="${GITHUB_REF_NAME}"; else ver="dev-${GITHUB_SHA::7}"; fi

          sha() { # portable sha256 -> <file>.sha256
            if [ "${RUNNER_OS}" = "macOS" ]; then shasum -a 256 "$1" > "$1.sha256";
            else sha256sum "$1" > "$1.sha256"; fi
          }

          bins="freemkv-flash freemkv-fw"
          if [ "${{ matrix.gui }}" = "true" ]; then bins="$bins freemkv-flash-gui freemkv-fw-gui"; fi

          for bin in $bins; do
            src="target/$target/release/$bin$ext"
            if [ ! -f "$src" ]; then
              echo "::warning::$src not found — skipping"
              continue
            fi
            stable="$bin-$osname-$arch"          # e.g. freemkv-flash-linux-x86_64
            versioned="$bin-$ver-$osname-$arch"
            # Like freemkv, every GUI download carries its CLI too: a -gui
            # archive holds <bin>-gui and <bin>.
            staged=("$bin$ext")
            case "$bin" in *-gui) staged+=("${bin%-gui}$ext") ;; esac
            for f in "${staged[@]}"; do cp "target/$target/release/$f" "$f"; done
            if [ "$fmt" = "zip" ]; then
              # Git-bash on the Windows runner ships these; PATH may not, so be explicit.
              7z a -tzip "$stable.$fmt" "${staged[@]}" >/dev/null
              cp "$stable.$fmt" "$versioned.$fmt"
            else
              tar czf "$stable.$fmt" "${staged[@]}"
              cp "$stable.$fmt" "$versioned.$fmt"
            fi
            sha "$stable.$fmt"
            sha "$versioned.$fmt"
            rm -f "${staged[@]}"
            # The CLIs also ship as bare binaries, freemkv's cli-binaries
            # naming: freemkv-flash-cli-x86_64-linux, ...-aarch64-macos,
            # ...-x86_64-windows.exe.
            case "$bin" in *-gui) ;; *)
              bare="$bin-cli-$arch-$osname$ext"
              cp "$src" "$bare"
              sha "$bare" ;;
            esac
          done

      # Manual runs (and branch dispatch, which cannot publish a Release) still
      # get retrievable artifacts. Paths are relative to $GITHUB_WORKSPACE, and
      # the archives are created under the freemkv-firmware/ checkout.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freemkv-${{ matrix.osname }}-${{ matrix.arch }}
          path: |
            freemkv-firmware/*.tar.gz
            freemkv-firmware/*.zip
            freemkv-firmware/*.sha256
            freemkv-firmware/*-cli-*-linux
            freemkv-firmware/*-cli-*-macos
            freemkv-firmware/*-cli-*-windows.exe
          if-no-files-found: error

      # Publish to the GitHub Release only for real version tags. softprops
      # creates/updates the release for the tag and attaches these files; each
      # matrix leg contributes its own, so the release accumulates all platforms.
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freemkv-firmware/*.tar.gz
            freemkv-firmware/*.zip
            freemkv-firmware/*.sha256
            freemkv-firmware/*-cli-*-linux
            freemkv-firmware/*-cli-*-macos
            freemkv-firmware/*-cli-*-windows.exe

  # ── Linux packages (.deb + AppImage) ────────────────────────────────────────
  # Mirrors freemkv's deb.yml / appimage.yml: Ubuntu 24.04 baseline, stable
  # unversioned names with a `.sha256` sidecar, dpkg-deb --root-owner-group,
  # lintian, then install + smoke-test on the runner. Per tool (flash, fw) and
  # per architecture (native runners, so the GUI links and is smoke-tested on
  # the arch it ships for):
  #   freemkv-<tool>-<amd64|arm64>.deb       static musl CLI only, no Depends
  #   freemkv-<tool>-gui-<amd64|arm64>.deb   desktop app + the same CLI
  #                                          (Conflicts/Replaces the CLI deb)
  #   freemkv-<tool>-<x86_64|aarch64>-linux.AppImage
  #                                          desktop app + CLI: no arguments
  #                                          opens the app, any runs the CLI
  # The packaging lives in packaging/linux/ (build-debs.sh, build-appimage.sh).
  # Unsigned, like every other asset here.
  linux-packages:
    needs: [resolve-msrv, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb: amd64
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            linuxdeploy_sha256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          - runner: ubuntu-24.04-arm
            deb: arm64
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            linuxdeploy_sha256: 620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: freemkv-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv-firmware
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-firmware
          shared-key: freemkv-firmware-release
          key: ${{ matrix.target }}-gui
      # eframe/egui/rfd have no -dev system deps (winit, GL and the portal
      # backend are loaded at runtime), unlike freemkv's GTK4/libadwaita app.
      - name: Install build and package tools
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config dpkg-dev lintian xvfb \
            desktop-file-utils imagemagick
          # Pinned + hash-checked like freemkv's appimage.yml: it runs in the release build.
          ld=linuxdeploy-${{ matrix.arch }}.AppImage
          curl -fsSLo "$ld" "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/$ld"
          echo "${{ matrix.linuxdeploy_sha256 }}  $ld" | sha256sum -c -
          chmod +x "$ld"
          echo "LINUXDEPLOY=$PWD/$ld" >> "$GITHUB_ENV"
      - name: Build the GUIs (glibc, release)
        run: cargo build --release --locked --target ${{ matrix.target }} -p freemkv-flash-gui -p freemkv-fw-gui
      - uses: actions/download-artifact@v4
        with:
          name: freemkv-linux-${{ matrix.arch }}
          path: freemkv-firmware/musl-cli
      - name: Validate the desktop entries
        run: desktop-file-validate packaging/linux/*.desktop
      - name: Build the .deb packages
        run: packaging/linux/build-debs.sh ${{ matrix.deb }} musl-cli target/${{ matrix.target }}/release linux-package
      - name: Build the AppImages
        run: |
          set -euo pipefail
          for t in freemkv-flash freemkv-fw; do
            packaging/linux/build-appimage.sh "$t" "target/${{ matrix.target }}/release/$t-gui" \
              "musl-cli/$t-cli-${{ matrix.arch }}-linux" ${{ matrix.arch }} linux-package
          done
      - name: Lint and inspect the packages
        run: |
          set -euo pipefail
          for deb in linux-package/*.deb; do
            lintian --fail-on error "$deb"
            dpkg-deb --info "$deb"; dpkg-deb --contents "$deb"
          done
      # Install into the runner (24.04, the baseline), run the CLIs, and make
      # sure each GUI is still running after 10s under a virtual display
      # (124 = timed out = alive), as freemkv's deb/AppImage jobs do. Then swap
      # each GUI package for its CLI-only package (Conflicts/Replaces) and back.
      - name: Install and smoke-test the packages
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          a=${{ matrix.deb }}
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri \
            ./linux-package/freemkv-flash-gui-$a.deb ./linux-package/freemkv-fw-gui-$a.deb
          for t in flash fw; do
            freemkv-$t --version | tee v.log; grep -Fq "$want" v.log
            ldd /usr/bin/freemkv-$t 2>&1 | grep -Eq 'statically linked|not a dynamic executable'
            test -f /usr/share/applications/org.freemkv.freemkv-$t-gui.desktop
            rc=0; xvfb-run -a timeout 10 /usr/bin/freemkv-$t-gui || rc=$?
            [ "$rc" = 124 ] || { echo "::error::freemkv-$t-gui exited early (rc=$rc)"; exit 1; }
            sudo apt-get install -y --no-install-recommends ./linux-package/freemkv-$t-$a.deb
            ! dpkg-query -W -f='${Status}\n' freemkv-$t-gui 2>/dev/null | grep -Fxq 'install ok installed' \
              || { echo "::error::freemkv-$t-gui is still installed alongside freemkv-$t"; exit 1; }
            test ! -e /usr/bin/freemkv-$t-gui
            freemkv-$t --version | tee v.log; grep -Fq "$want" v.log
            sudo apt-get install -y --no-install-recommends ./linux-package/freemkv-$t-gui-$a.deb
            test -x /usr/bin/freemkv-$t-gui
          done
      - name: Smoke-test the AppImages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          for t in freemkv-flash freemkv-fw; do
            img="linux-package/$t-${{ matrix.arch }}-linux.AppImage"
            # Any argument runs the CLI ...
            "$img" --version | tee v.log; grep -Fq "$want" v.log
            # ... and a symlink named after the CLI does too.
            ln -sf "$PWD/$img" "$RUNNER_TEMP/$t"; "$RUNNER_TEMP/$t" --version | grep -Fq "$want"
            # No arguments opens the desktop app (124 = timed out = alive).
            rc=0; xvfb-run -a timeout 10 "$img" || rc=$?
            [ "$rc" = 124 ] || { echo "::error::$img GUI exited early (rc=$rc)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.deb }}
          path: freemkv-firmware/linux-package/*
          if-no-files-found: error
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freemkv-firmware/linux-package/*.deb
            freemkv-firmware/linux-package/*.AppImage
            freemkv-firmware/linux-package/*.sha256

  # ── Windows installers (Inno Setup) + portable zips ─────────────────────────
  # Mirrors freemkv's build-windows job and packaging/windows/freemkv.iss: a
  # per-user installer (PrivilegesRequired=lowest, %LOCALAPPDATA%\Programs),
  # PATH added/removed on install/uninstall, Start-menu shortcut, UNSIGNED, plus
  # a portable zip -- one of each PER TOOL, like freemkv's app, each holding the
  # tool's GUI (windowed) and CLI (console):
  #   freemkv-flash-<arch>-windows-setup.exe / .zip     freemkv-flash(.exe, -gui.exe)
  #   freemkv-fw-<arch>-windows-setup.exe / .zip        freemkv-fw(.exe, -gui.exe)
  #   freemkv-firmware-<arch>-windows-setup.exe / .zip  all four (the original bundle)
  # each with a .sha256. The bare CLI .exe (freemkv-<tool>-cli-<arch>-windows.exe)
  # and the per-binary freemkv-<bin>-windows-<arch>.zip archives come from `build`.
  # No winget manifest, by decision.
  windows-installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: freemkv-windows-${{ matrix.arch }}
          path: dl
      - name: Stage the binaries and zip
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $tools = @{
            'freemkv-flash'    = @('freemkv-flash','freemkv-flash-gui')
            'freemkv-fw'       = @('freemkv-fw','freemkv-fw-gui')
            'freemkv-firmware' = @('freemkv-flash','freemkv-fw','freemkv-flash-gui','freemkv-fw-gui')
          }
          foreach ($t in $tools.Keys) {
            New-Item -ItemType Directory -Force "stage/$t" | Out-Null
            foreach ($b in $tools[$t]) {
              Expand-Archive -Path "dl/$b-windows-$env:ARCH.zip" -DestinationPath "stage/$t" -Force
              if (-not (Test-Path "stage/$t/$b.exe")) { throw "$b-windows-$env:ARCH.zip did not contain $b.exe" }
            }
            Compress-Archive -Path "stage/$t/*" -DestinationPath "$t-$env:ARCH-windows.zip" -Force
          }
      - name: Build the installers
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.4.3 -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # A branch build has no version tag; the installer only needs a numeric one.
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:TAG.TrimStart('v') } else { '0.0.0' }
          foreach ($t in 'freemkv-flash','freemkv-fw','freemkv-firmware') {
            & $iscc "/DTool=$t" "/DArch=$env:ARCH" "/DAppVersion=$ver" "/DBinDir=$((Resolve-Path "stage/$t").Path)" "/O$PWD" packaging/windows/freemkv-firmware.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc ($t) exited $LASTEXITCODE" }
          }
      # Round-trip each installer: files, shortcuts and PATH land; uninstall
      # removes them and leaves the user's other PATH entries intact.
      - name: Verify the installers
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') }
          $keep = @("$env:RUNNER_TEMP\keep-a", "$env:RUNNER_TEMP\keep-b")
          [Environment]::SetEnvironmentVariable('Path', ((@((& $userPath) -split ';') + $keep) | Where-Object { $_ }) -join ';', 'User')
          $cases = @(
            @{ t = 'freemkv-flash';    clis = @('freemkv-flash'); guis = @('freemkv-flash-gui'); lnks = @('freemkv Flash') },
            @{ t = 'freemkv-fw';       clis = @('freemkv-fw');    guis = @('freemkv-fw-gui');    lnks = @('freemkv Modify') },
            @{ t = 'freemkv-firmware'; clis = @('freemkv-flash','freemkv-fw'); guis = @('freemkv-flash-gui','freemkv-fw-gui'); lnks = @('freemkv Flash','freemkv Modify') }
          )
          foreach ($c in $cases) {
            $dir = "$env:LOCALAPPDATA\Programs\$($c.t)"
            $lnks = $c.lnks | ForEach-Object { "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\$_.lnk" }
            $before = (& $userPath) -split ';'
            Start-Process -Wait "./$($c.t)-$env:ARCH-windows-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            foreach ($f in (@($c.clis + $c.guis) | ForEach-Object { "$_.exe" }) + 'unins000.exe') {
              if (-not (Test-Path "$dir\$f")) { throw "$($c.t) installer did not create $dir\$f" }
            }
            foreach ($l in $lnks) { if (-not (Test-Path $l)) { throw "$($c.t) installer did not create $l" } }
            if ((& $userPath) -split ';' -notcontains $dir) { throw "$($c.t) installer did not add $dir to the user PATH" }
            foreach ($b in $c.clis) {
              & "$dir\$b.exe" --version
              if ($LASTEXITCODE -ne 0) { throw "installed $b --version exited $LASTEXITCODE" }
            }
            Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            # The uninstaller relaunches itself from %TEMP%, so -Wait can return early.
            $probe = "$dir\$($c.clis[0]).exe"
            $done = { -not (Test-Path $probe) -and ((& $userPath) -split ';' -notcontains $dir) }
            for ($i = 0; $i -lt 60 -and -not (& $done); $i++) { Start-Sleep 1 }
            if (Test-Path $probe) { throw "$($c.t) uninstaller left $probe" }
            if ((& $userPath) -split ';' -contains $dir) { throw "$($c.t) uninstaller left $dir on the user PATH" }
            foreach ($l in $lnks) { if (Test-Path $l) { throw "$($c.t) uninstaller left $l" } }
            $after = (& $userPath) -split ';'
            if (Compare-Object $before $after -SyncWindow 0) { throw "$($c.t) uninstall changed other user PATH entries" }
          }
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          for t in freemkv-flash freemkv-fw freemkv-firmware; do
            A="$t-${{ matrix.arch }}-windows"
            sha256sum "$A.zip" > "$A.zip.sha256"
            sha256sum "$A-setup.exe" > "$A-setup.exe.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ matrix.arch }}
          path: |
            *-${{ matrix.arch }}-windows.zip*
            *-${{ matrix.arch }}-windows-setup.exe*
          if-no-files-found: error
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *-${{ matrix.arch }}-windows.zip
            *-${{ matrix.arch }}-windows.zip.sha256
            *-${{ matrix.arch }}-windows-setup.exe
            *-${{ matrix.arch }}-windows-setup.exe.sha256

  # Refresh the Homebrew tap (freemkv/homebrew-tap) to this release: the
  # freemkv-flash / freemkv-fw formulae and their -gui casks. update.sh reads the
  # published release assets and hashes them itself. Tag pushes only -- a branch
  # workflow_dispatch publishes no Release to point the tap at. Same auth and
  # flow as the freemkv app's update-homebrew-tap job.
  update-homebrew-tap:
    needs: [build]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Update the tap to this release
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          VER: ${{ github.ref_name }}
          # Free-text actor passed via env, not interpolated into the run script.
          ACTOR: ${{ github.actor }}
          # update.sh downloads the release assets from this repo.
          FMKV_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || {
            echo "::warning::ORG_DISPATCH_TOKEN is not set — the Homebrew tap was NOT updated"
            echo "::warning::brew install will keep serving the previous release until it is"
            exit 0
          }
          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/freemkv/homebrew-tap.git" tap
          cd tap
          ./update.sh "${VER#v}"
          if git diff --quiet; then
            echo "tap already at ${VER#v} — nothing to do"
            exit 0
          fi
          git config user.name  "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          git commit -aqm "freemkv-firmware ${VER#v}"
          # The app release job pushes to the same branch; rebase and retry if
          # it landed first.
          for i in 1 2 3; do
            git push && break
            git pull --rebase -q
          done
          echo "tap updated to ${VER#v}" >> "$GITHUB_STEP_SUMMARY"
